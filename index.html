<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Lab 1 — Trang Chủ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { color: #667eea; margin-bottom: 8px; font-size: 32px; }
        h2 { color: #764ba2; margin-bottom: 12px; font-size: 18px; font-weight: normal; }
        h3, h4 { color: #555; margin-bottom: 8px; }
        .info { background: #f8f9fa; border-radius: 8px; padding: 20px; margin: 16px 0; text-align: left; }
        .info p { margin: 8px 0; }
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin: 4px;
        }
        .footer { margin-top: 24px; font-size: 13px; color: #999; }
        .status { color: #38a169; font-weight: bold; }
        nav { margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
        nav a { color: #667eea; text-decoration: none; font-weight: bold; margin: 0 10px; transition: 0.3s; }
        nav a:hover { color: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Thanh điều hướng Navigation -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <!-- Ảnh đại diện -->
        <img src="avatar.jpg" alt="avatar" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 16px; border: 3px solid #667eea;">
        
        <h1> Hello, DevOps!</h1>
        <h2>Lab 1 — Trải nghiệm CI/CD Pipeline</h2>
        <h3>An ba to com</h3>
        <h4>an com nhe?</h4>

        <div class="info">
            <p> <strong>Bài học: So 1</strong> DevOps Lab 1 — Tổng quan</p>
            <p> <strong>Deploy bởi:</strong> GitHub Actions CI/CD</p>
            <p> <strong>Ngày deploy:</strong> <span class="date"></span></p>
            <p> <strong>Pipeline status:</strong> <span class="status"> Automated</span></p>
        </div>

        <div>
            <span class="badge">HTML5</span>
            <span class="badge">CSS3</span>
            <span class="badge">Git</span>
            <span class="badge">GitHub Actions</span>
        </div>

        <div class="footer">
            <p>Deployed automatically via GitHub Actions Pipeline</p>
        </div>
    </div>

    <script>
        document.querySelector('.date').textContent = new Date().toLocaleDateString('vi-VN');
    </script>
</body>
</html>
